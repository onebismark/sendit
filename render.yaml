databases:
  - name: sendit-db
    plan: free

services:
  - type: web
    name: sendit
    runtime: node
    plan: free          # change to "starter" so the service never sleeps
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ROOM_TTL_MIN
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: sendit-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: MAIL_FROM
        sync: false
